    <path id="twig-left-upper-a"
          d="M199 -136 C184 -134 171 -130 159 -124"
          stroke-width="3.4"/>
    <path id="twig-right-upper-a"
          d="M327 -144 C340 -128 350 -110 355 -90"
          stroke-width="3.3"/>
