<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 -280 1200 980"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Mahogany Stem</title>
  <desc id="desc">Animation-ready mahogany sprout stem aligned to the root and sprout asset coordinate system.</desc>
  <defs>
    <linearGradient id="stemGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B99867"/>
      <stop offset="48%" stop-color="#91A05E"/>
      <stop offset="100%" stop-color="#6F8348"/>
    </linearGradient>
  </defs>
  <g id="stem" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="stem-main"
